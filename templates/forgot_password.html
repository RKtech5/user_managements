{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <div class="icon-bubble">✦</div><div class="eyebrow">ACCOUNT RECOVERY</div>
    <h1>Forgot your password?</h1>
    <p class="muted">Enter your account email and we’ll help you reset it.</p>
    <form method="post" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email address<input type="email" name="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label>
      <button class="button button-primary button-wide" type="submit">Send reset link</button>
    </form>
    <p class="auth-bottom"><a href="{{ url_for('login') }}">← Back to login</a></p>
  </div>
</section>
{% endblock %}
