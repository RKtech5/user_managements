{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <div class="eyebrow">WELCOME BACK</div>
    <h1>Sign in to your account</h1>
    <p class="muted">Manage your records with confidence.</p>
    <form method="post" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email address<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required maxlength="254"></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" placeholder="Enter your password" required></label>
      <div class="form-between"><span class="muted small">Your workspace, all in one place.</span><a href="{{ url_for('forgot_password') }}">Forgot password?</a></div>
      <button class="button button-primary button-wide" type="submit">Login <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-bottom">New to UserHub? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
