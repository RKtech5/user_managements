{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <div class="eyebrow">SECURE YOUR ACCOUNT</div><h1>Choose a new password</h1>
    <p class="muted">Use at least 10 characters.</p>
    <form method="post" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>New password<input type="password" name="password" minlength="10" autocomplete="new-password" required></label>
      <label>Confirm new password<input type="password" name="confirm_password" minlength="10" autocomplete="new-password" required></label>
      <button class="button button-primary button-wide" type="submit">Reset password</button>
    </form>
  </div>
</section>
{% endblock %}
